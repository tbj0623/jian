name: Publish H5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local rules and backup guards
        run: |
          node test/engine.test.mjs
          node test/hardening.test.mjs
          node test/backup_crypto.test.mjs
      - name: Build static H5
        run: |
          node scripts/build-www.mjs
          touch www/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./www
      - id: deploy
        uses: actions/deploy-pages@v4
